<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Range Slider</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            max-width: 400px;
        }

        .label {
            font-weight: bold;
            color: #333;
        }

        .range-wrapper {
            flex-grow: 1;
            position: relative;
        }

        .range-slider {
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            height: 8px;
            border-radius: 5px;
            background: linear-gradient(to right, #7b5cff 50%, #ddd 50%);
            outline: none;
            transition: background 0.15s ease-in-out;
        }

        .range-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            background: #1e1e2d;
            border-radius: 50%;
            cursor: pointer;
            border: none;
            position: relative;
        }

        .value {
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="slider-container">
    <label class="label">Limits of Balance:</label>
    <span class="value" id="rangeValue">$4000</span>
</div>
<div class="range-wrapper">
    <input type="range" min="0" max="10000" value="4000" class="range-slider" id="balanceRange">
</div>
<script>
    const rangeInput = document.getElementById("balanceRange");
    const rangeValue = document.getElementById("rangeValue");

    rangeInput.addEventListener("input", () => {
        rangeValue.textContent = `$${rangeInput.value}`;
        const percentage = (rangeInput.value - rangeInput.min) / (rangeInput.max - rangeInput.min) * 100;
        rangeInput.style.background = `linear-gradient(to right, #7b5cff ${percentage}%, #ddd ${percentage}%)`;
    });
</script>

</body>
</html>
